# Single source of truth for run configuration. Validated by src/decision_model_eval/config.py.

# Outside the repo; never committed. Never inside a synced folder either.
db_path: ~/.local/share/decision-model-eval/listings.db
# Consistent copies from `dme backup`, written after every ingest. Local until an
# off-site target is chosen.
backup_dir: ~/.local/share/decision-model-eval/backups
# Kept: the 3 newest copies, the newest of each of the last 14 days, the newest of
# every month.
keep_backups: 3
keep_backup_days: 14
random_seed: 42

# Keys into the registry in src/decision_model_eval/backends.py
backends: [jev, haiku]
labeler: opus

# The SciFact control set: public data, fetched by `dme scifact download`.
scifact_dir: ~/.local/share/decision-model-eval/scifact
